name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

# a pull request from a branch in this repository is already built by its push; the tests run
# first and every build waits for them, and a run that ends red deletes what it uploaded, so only
# a green run offers anything to download
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Desktop tests
        run: go run ./tools/linnstrument test

      - name: Example tests
        run: node --test examples/browser/*.test.js

      - name: Check midi.md against the firmware and the generated NRPN table
        run: go test ./... && go run ./tools/linnstrument nrpns && git diff --exit-code examples/browser/nrpn_parameters.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # arduino-cli requires the sketch folder to carry the sketch name
          path: linnstrument-firmware

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the Arduino SAM core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:sam@1.6.12

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn arduino:sam:arduino_due_x \
            --libraries linnstrument-firmware/libraries \
            --output-dir out \
            linnstrument-firmware

      - name: Name the firmware file after the version and commit
        run: |
          version=$(sed -n 's/^const char\* OSVersion = "\([0-9.]*\)";/\1/p' linnstrument-firmware/linnstrument-firmware.ino)
          build=$(sed -n 's/^const char\* OSVersionBuild = "\(\.[0-9]*\)";/\1/p' linnstrument-firmware/linnstrument-firmware.ino)
          version=${version%.}   # OSVersion ends with the dot OSVersionBuild starts with
          sha=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "FIRMWARE_NAME=linnstrument-firmware-${version}${build}-${sha}" >> "$GITHUB_ENV"
          cp out/linnstrument-firmware.ino.bin "out/linnstrument-firmware-${version}${build}-${sha}.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_NAME }}
          path: out/${{ env.FIRMWARE_NAME }}.bin
          if-no-files-found: error

  tool:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # the serial port enumerator needs cgo on macOS, so the macOS binaries are built there
      - name: Build tools/linnstrument for Linux and Windows
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          GOOS=linux   GOARCH=amd64 go build -o out/linnstrument-linux-amd64 ./tools/linnstrument
          GOOS=linux   GOARCH=arm64 go build -o out/linnstrument-linux-arm64 ./tools/linnstrument
          GOOS=windows GOARCH=amd64 go build -o out/linnstrument-windows.exe ./tools/linnstrument

      - name: Build tools/linnstrument for macOS (universal)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          CGO_ENABLED=1 GOARCH=arm64 go build -o out/linnstrument-arm64 ./tools/linnstrument
          CGO_ENABLED=1 GOARCH=amd64 go build -o out/linnstrument-amd64 ./tools/linnstrument
          lipo -create -output out/linnstrument-macos out/linnstrument-arm64 out/linnstrument-amd64
          rm out/linnstrument-arm64 out/linnstrument-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: linnstrument-tool-${{ matrix.name }}
          path: out/*

  virtual:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Virtual LinnStrument
        run: |
          cmake -S tools/virtual -B build/virtual -DCMAKE_BUILD_TYPE=Release
          cmake --build build/virtual --config Release -j3

      - name: Screenshot it
        run: |
          "build/virtual/VirtualLinnStrument_artefacts/Release/Virtual LinnStrument.app/Contents/MacOS/Virtual LinnStrument" --screenshot build/virtual-linnstrument.png

      - name: Zip the app
        run: |
          cd build/virtual/VirtualLinnStrument_artefacts/Release
          ditto -c -k --keepParent "Virtual LinnStrument.app" "$GITHUB_WORKSPACE/build/virtual-linnstrument-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: virtual-linnstrument-macos
          path: |
            build/virtual-linnstrument-macos.zip
            build/virtual-linnstrument.png

  # a pull request from a fork gets a read-only token, so there this step cannot delete and fails
  discard:
    needs: [test, build, tool, virtual]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the artifacts of a run that did not pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
