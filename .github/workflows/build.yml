name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

# a pull request from a branch in this repository is already built by its push; the tests run
# first and every build waits for them, and a run that ends red deletes what it uploaded, so only
# a green run offers anything to download
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Desktop tests
        run: go run ./tools/linnstrument test

      - name: Example tests
        run: node --test examples/browser/*.test.js

      - name: Check midi.md against the firmware and the generated NRPN table
        run: go test ./... && go run ./tools/linnstrument nrpns && git diff --exit-code examples/browser/nrpn_parameters.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # arduino-cli requires the sketch folder to carry the sketch name
          path: linnstrument-firmware

      # arduino-cli's own installer, pinned: arduino/setup-arduino-cli still runs on Node 20
      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/v1.5.1/install.sh | BINDIR="$HOME/.local/bin" sh -s 1.5.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the Arduino SAM core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:sam@1.6.12

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn arduino:sam:arduino_due_x \
            --libraries linnstrument-firmware/libraries \
            --output-dir out \
            linnstrument-firmware

      - name: Name the firmware file after the version and commit
        run: |
          name="linnstrument-firmware-$(linnstrument-firmware/tools/build-name.sh "$GITHUB_SHA")"
          echo "FIRMWARE_NAME=$name" >> "$GITHUB_ENV"
          cp out/linnstrument-firmware.ino.bin "out/$name.bin"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FIRMWARE_NAME }}
          path: out/${{ env.FIRMWARE_NAME }}.bin
          if-no-files-found: error

  tool:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Name the build after the version and commit
        run: echo "BUILD_NAME=$(tools/build-name.sh "$GITHUB_SHA")" >> "$GITHUB_ENV"

      # the serial port enumerator needs cgo on macOS, so the macOS binaries are built there
      - name: Build tools/linnstrument for Linux and Windows
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          GOOS=linux   GOARCH=amd64 go build -ldflags "-X main.version=$BUILD_NAME" -o out/linnstrument-linux-amd64 ./tools/linnstrument
          GOOS=linux   GOARCH=arm64 go build -ldflags "-X main.version=$BUILD_NAME" -o out/linnstrument-linux-arm64 ./tools/linnstrument
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=$BUILD_NAME" -o out/linnstrument-windows.exe ./tools/linnstrument

      - name: Build tools/linnstrument for macOS (universal)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "-X main.version=$BUILD_NAME" -o out/linnstrument-arm64 ./tools/linnstrument
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "-X main.version=$BUILD_NAME" -o out/linnstrument-amd64 ./tools/linnstrument
          lipo -create -output out/linnstrument-macos out/linnstrument-arm64 out/linnstrument-amd64
          rm out/linnstrument-arm64 out/linnstrument-amd64

      # signed and notarised so that a downloaded copy runs without removing its quarantine; a
      # bare program can't have its ticket stapled, so macOS asks Apple on the first run
      - name: Import the Developer ID certificate
        id: signing
        if: runner.os == 'macOS'
        uses: ./.github/actions/developer-id
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          notary-key: ${{ secrets.NOTARY_KEY }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}

      - name: Sign and notarise the macOS tool
        if: runner.os == 'macOS' && steps.signing.outputs.identity != '-'
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          codesign --force --timestamp --options=runtime --sign "$IDENTITY" out/linnstrument-macos
          codesign --verify --strict out/linnstrument-macos
          ditto -c -k out/linnstrument-macos "$RUNNER_TEMP/linnstrument-macos.zip"
          xcrun notarytool submit "$RUNNER_TEMP/linnstrument-macos.zip" --keychain-profile notary --wait
          codesign --verify --check-notarization -R=notarized out/linnstrument-macos

      - uses: actions/upload-artifact@v7
        with:
          name: linnstrument-tool-${{ matrix.name }}-${{ env.BUILD_NAME }}
          path: out/*

  virtual:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Name the build after the version and commit
        run: echo "BUILD_NAME=$(tools/build-name.sh "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Build Virtual LinnStrument
        run: |
          cmake -S tools/virtual -B build/virtual -DCMAKE_BUILD_TYPE=Release
          cmake --build build/virtual --config Release -j3

      # its own code: the touches and slides, the engine's pace, the surface and the firmware bridge
      - name: Run its tests
        run: build/virtual/VirtualTests_artefacts/Release/VirtualTests

      # two copies of the firmware in one program, as a plugin host with several instances needs:
      # they must still link, and two engines must run side by side without sharing state
      - name: Run its tests with two copies of the firmware
        run: |
          cmake -S tools/virtual -B build/virtual-copies -DCMAKE_BUILD_TYPE=Release -DLINN_FIRMWARE_COPIES=2 -DJUCE_PATH="$PWD/build/virtual/_deps/juce-src"
          cmake --build build/virtual-copies --config Release --target VirtualTests -j3
          build/virtual-copies/VirtualTests_artefacts/Release/VirtualTests

      # the built app driven the way a script or an assistant drives it: a tap plays one note
      - name: Drive it by script
        run: |
          app="build/virtual/VirtualLinnStrument_artefacts/Release/Virtual LinnStrument.app/Contents/MacOS/Virtual LinnStrument"
          printf 'sleep 1\nview\nreceived\ntap 5 3 150\nsleep 0.3\nreceived 1\nquit\n' | "$app" --script - > build/script.txt
          cat build/script.txt
          grep -q '^the whole instrument$' build/script.txt
          test "$(grep -c '^9[0-9A-F] [0-9A-F][0-9A-F] \([1-7][0-9A-F]\|0[1-9A-F]\)$' build/script.txt)" = 1
          grep -q '^8[0-9A-F] ' build/script.txt

      - name: Screenshot it
        run: |
          "build/virtual/VirtualLinnStrument_artefacts/Release/Virtual LinnStrument.app/Contents/MacOS/Virtual LinnStrument" --screenshot "build/virtual-linnstrument-$BUILD_NAME.png"

      # The app is signed with the Developer ID in the repository's secrets and notarised, so it
      # opens like any downloaded app. Without the secrets, as in a pull request from a fork, it's
      # signed ad hoc instead: only the linker signs the executable, and macOS calls a downloaded
      # bundle whose resources aren't sealed damaged, with no Open Anyway.
      - name: Import the Developer ID certificate
        id: signing
        uses: ./.github/actions/developer-id
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          notary-key: ${{ secrets.NOTARY_KEY }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.NOTARY_ISSUER_ID }}

      - name: Sign, notarise and zip the app
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          cd build/virtual/VirtualLinnStrument_artefacts/Release
          zip="$GITHUB_WORKSPACE/build/virtual-linnstrument-macos-$BUILD_NAME.zip"
          if [ "$IDENTITY" = "-" ]; then
            codesign --force --deep --sign - "Virtual LinnStrument.app"
          else
            codesign --force --deep --strict --timestamp --options=runtime --sign "$IDENTITY" "Virtual LinnStrument.app"
          fi
          codesign --verify --deep --strict "Virtual LinnStrument.app"
          ditto -c -k --keepParent "Virtual LinnStrument.app" "$zip"
          if [ "$IDENTITY" != "-" ]; then
            xcrun notarytool submit "$zip" --keychain-profile notary --wait
            xcrun stapler staple "Virtual LinnStrument.app"
            spctl --assess --type execute -vv "Virtual LinnStrument.app"
            rm "$zip"
            ditto -c -k --keepParent "Virtual LinnStrument.app" "$zip"
          fi

      # uploaded as they are, so the download is the app's zip itself, not a zip around it
      - uses: actions/upload-artifact@v7
        with:
          path: build/virtual-linnstrument-macos-${{ env.BUILD_NAME }}.zip
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: build/virtual-linnstrument-${{ env.BUILD_NAME }}.png
          archive: false

  # a pull request from a fork gets a read-only token, so there this step cannot delete and fails
  discard:
    needs: [test, build, tool, virtual]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the artifacts of a run that did not pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
